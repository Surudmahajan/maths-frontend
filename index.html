<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Engineering Mathematics AI Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <div class="header">
      <h1>Engineering Mathematics AI Engine</h1>
      <p>Algebra • Calculus • Differential Equations • Numerical Methods</p>
    </div>

    <textarea
      id="userInput"
      placeholder="Example: find the rank of the matrix [[1,2],[3,4]]"
    ></textarea>

    <button onclick="send()">Run</button>

    <div class="status" id="status"></div>

    <div id="form"></div>

    <pre id="output"></pre>
<div class="app">

  <!-- header, input, form, output -->
  <pre id="output"></pre>

  <!-- VISUALS PANEL -->
  <div class="visuals-panel" id="visuals-panel">

    <div class="visuals-toolbar">
      <span>Visuals</span>
      <div class="visuals-actions">
        <button onclick="toggleVisuals()">Hide</button>
        <button onclick="fullscreenVisuals()">Fullscreen</button>
      </div>
    </div>

    <iframe
      id="visuals-iframe"
      src="https://surudmahajan.github.io/test/"
      loading="lazy"
    ></iframe>

  </div>

</div>





  <script type="module">
    import { sendMessage } from "./chat.js?v=1";
    window.send = sendMessage;
  </script>
    <script>
  let visualsVisible = true;

  function toggleVisuals() {
    const panel = document.getElementById("visuals-panel");
    const btn = event.target;

    visualsVisible = !visualsVisible;
    panel.classList.toggle("hidden", !visualsVisible);

    btn.textContent = visualsVisible ? "Hide" : "Show";
  }

  function fullscreenVisuals() {
    const panel = document.getElementById("visuals-panel");
    panel.classList.toggle("fullscreen");

    // Safety: fullscreen should always be visible
    panel.classList.remove("hidden");
  }
</script>

  

</body>
</html>
